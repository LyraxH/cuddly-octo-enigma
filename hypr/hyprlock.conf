background {
    monitor =
    path = ~/Downloads/idk.png
    color = rgba(26, 27, 38, 1.0)
    blur_passes = 2 
    blur_size = 6
    brightness = 0.5
}

label { #TIME
    monitor = 
    text = $TIME
    color = rgb(f9a8d4)
    font_size = 222
    font_family = JetBrains Mono Extrabold
    position = 0, 420
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(249, 168, 212, 0.3)
}

label { #DATE
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = rgb(bb9af7)
    font_size = 34
    font_family = JetBrains Mono Extra
    position = 0, 250
    halign = center
    valign = center
}

# USER PFP
image {
    monitor =
    path = ~/Downloads/pfpslol/hina2.jpg
    size = 300
    rounding = -1
    border_size = 4
    border_color = rgb(f9a8d4)
    position = 0, 0
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 420, 69
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(bb9af7)
    inner_color = rgba(26, 27, 38, 0.6)
    font_color = rgb(f9a8d4)
    fade_on_empty = true
    placeholder_text = <i><span foreground="##f9a8d4">(˶˃ ᵕ ˂˶) .ᐟ.ᐟ</span></i>
    hide_input = false
    fail_color = rgb(f7768e)
    position = 0, -222
    halign = center
    valign = center
}
